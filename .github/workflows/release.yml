name: Release

# Push a tag like v1.0.0 (matching appVersion in app/build.gradle.kts) to publish a signed APK
# as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version and has changelog notes
        run: |
          version=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersion $version in app/build.gradle.kts"
            exit 1
          fi
          if ! bash .github/scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::Add a '## $version' section to CHANGELOG.md describing this release"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REELSAVER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The REELSAVER_KEYSTORE_BASE64 secret is missing, so the APK can't be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reel-saver-release.jks"
          echo "REELSAVER_KEYSTORE_FILE=$RUNNER_TEMP/reel-saver-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          REELSAVER_KEYSTORE_PASSWORD: ${{ secrets.REELSAVER_KEYSTORE_PASSWORD }}
          REELSAVER_KEY_ALIAS: ${{ secrets.REELSAVER_KEY_ALIAS }}
          REELSAVER_KEY_PASSWORD: ${{ secrets.REELSAVER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="reel-saver-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Reel Saver $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
